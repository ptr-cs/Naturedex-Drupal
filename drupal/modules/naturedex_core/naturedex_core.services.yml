services:
  _defaults:
    autowire: true
  Drupal\naturedex_core\Records: ~
  Drupal\naturedex_core\PageContext: ~
  Drupal\naturedex_core\Seeder: ~
  Drupal\naturedex_core\Status: ~
  Drupal\naturedex_core\Routing\RouteSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\naturedex_core\EventSubscriber\SharedCacheSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\naturedex_core\EventSubscriber\StatusCacheSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\naturedex_core\EventSubscriber\HideAccountsSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\naturedex_core\StackMiddleware\CloudFrontMiddleware:
    autowire: false
    tags:
      # Before the page cache (200), which keys cached pages on the scheme.
      - { name: http_middleware, priority: 350 }
