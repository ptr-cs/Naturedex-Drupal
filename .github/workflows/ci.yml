name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: infra
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install Drupal with SQLite
        run: npm run setup
        env:
          # Setup reads FrankenPHP's release metadata from the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Unit tests
        run: npm test
      - name: Browser tests
        if: ${{ !cancelled() }}
        run: npx playwright test
      - name: Infrastructure tests
        if: ${{ !cancelled() }}
        run: npm --prefix infra test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Production image on MySQL
    # ARM, like the Fargate tasks, so this tests the architecture that ships.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t naturedex-drupal:ci .
      - run: docker/smoke-test.sh naturedex-drupal:ci
