ServerTokens Prod
ServerSignature Off

# Before the bootstrap task runs, the database is empty and the web installer
# would let any visitor claim the site. Installation and database updates run
# as one-off tasks instead (naturedex-bootstrap, naturedex-task).
<LocationMatch "^/(core/)?(install|update|rebuild|authorize)\.php">
  Require all denied
</LocationMatch>

<LocationMatch "^/(core|modules|themes)/">
  Header set Cache-Control "public, max-age=86400"
</LocationMatch>

# Release notes and readmes name the software and help date it. robots.txt stays.
<LocationMatch "(^/(core|modules|themes|profiles)/.*|^/(?!robots\.txt$)[^/]+)\.(txt|md)$">
  Require all denied
</LocationMatch>

# Also removed inside Drupal; this covers anything that slips past it.
Header always unset X-Generator
